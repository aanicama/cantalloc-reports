spring:
  datasource:
    url: jdbc:mysql://localhost:3306/demoservices
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQLDialect
    open-in-view: false
  logging:
    level:
      root: INFO
      org.springframework: DEBUG
      org.hibernate.SQL: DEBUG
      net.sf.jasperreports: DEBUG

server:
  port: 8083